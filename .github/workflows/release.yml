name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project WallFlow.xcodeproj -scheme WallFlow

      - name: Build and package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: zsh scripts/package.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WallFlow-macOS.zip
          generate_release_notes: true
          body: |
            Download **WallFlow-macOS.zip**, unzip it, and drag **WallFlow** into Applications.

            If macOS says it can’t be verified, right-click the app → **Open** → **Open**.
            Ad-hoc builds are not notarized until Developer ID credentials are added.

            Sparkle can update installed copies when this release also includes `appcast.xml`.

      - name: Attach Sparkle appcast
        if: hashFiles('dist/appcast.xml') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/appcast.xml
          fail_on_unmatched_files: true
