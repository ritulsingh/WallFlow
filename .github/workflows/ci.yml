name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build WallFlow
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project WallFlow.xcodeproj -scheme WallFlow

      - name: Build
        run: |
          xcodebuild \
            -project WallFlow.xcodeproj \
            -scheme WallFlow \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build
